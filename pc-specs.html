<style>
:root{
  --accent: #9146FF;
  --accent-soft: rgba(145,70,255,.16);
  --accent-line: rgba(145,70,255,.34);
  --accent-fg: #000;
  --radius: 16px;
  color-scheme: dark;
}
*{ box-sizing: border-box; }
html, body{ min-height: 100%; }
body{
  margin: 0; padding: 0;
  background: #0a0710;
  font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.dragging-comp *{ cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
.app{ display: flex; gap: 24px; padding: 24px; align-items: flex-start; min-height: 100vh; }
.preview-col{ flex: 0 0 auto; padding: 16px; }
.editor-col{
  flex: 1; min-width: 400px; max-width: 720px;
  background: #14101e;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 16px;
  padding: 18px 20px 24px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  position: sticky; top: 24px;
  color: #e8e6f0;
}
.editor-col::-webkit-scrollbar{ width: 8px; }
.editor-col::-webkit-scrollbar-track{ background: transparent; }
.editor-col::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.1); border-radius: 4px; }
.editor-col::-webkit-scrollbar-thumb:hover{ background: var(--accent); }
.editor-col h2{
  margin: 0 0 18px; font-size: 14px; letter-spacing: 2px;
  text-transform: uppercase; color: #fff;
  display: flex; align-items: center; gap: 10px; font-weight: 700;
  flex-wrap: nowrap;
}
.editor-col h2::before{
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
  flex-shrink: 0;
}
.editor-col h2 > span{ flex-shrink: 0; }
.editor-col h2 .h2-swatches{
  margin-left: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0;
  font-weight: 400;
  text-transform: none;
  flex-shrink: 0;
}
.editor-col h2 .h2-swatches .pc-dot-btn{
  width: 26px; height: 26px;
  border-width: 2px;
  box-shadow: 0 0 6px var(--c);
}
.editor-col h2 .h2-swatches .pc-dot-btn:hover{ transform: scale(1.15); }
.editor-col h2 .h2-swatches .pc-dot-btn.active{ transform: scale(1.1); }
.editor-col h2 .h2-swatches .pc-custom-dot{
  width: 26px; height: 26px;
  border-width: 2px;
}
.editor-col h2 .h2-swatches .pc-custom-remove{
  top: -6px; right: -6px;
  width: 15px; height: 15px;
  font-size: 9px;
  border-width: 1.5px;
}

/* ============ LANGUAGE TOGGLE ============ */
.editor-col h2 .lang-toggle{
  margin-left: auto;
  display: flex;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 7px;
  overflow: hidden;
  flex-shrink: 0;
  letter-spacing: 0;
  text-transform: none;
  font-weight: 400;
}
.editor-col h2 .lang-toggle button{
  padding: 5px 11px;
  background: transparent;
  border: none;
  color: rgba(255,255,255,.5);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 1.2px;
  cursor: pointer;
  transition: background .15s, color .15s;
  font-family: inherit;
  border-radius: 0;
  width: auto;
}
.editor-col h2 .lang-toggle button:hover{ color: var(--accent); background: rgba(255,255,255,.05); }
.editor-col h2 .lang-toggle button.active{
  background: var(--accent);
  color: var(--accent-fg);
}
.editor-col h2 .lang-toggle button.active:hover{ color: var(--accent-fg); filter: brightness(1.1); }

/* ============ HELP BUTTON ============ */
.editor-col h2 .h2-help{
  width: 28px; height: 28px;
  flex-shrink: 0;
  margin-left: 6px;
  padding: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.5);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: border-color .15s, color .15s, transform .15s;
  font-family: inherit;
  letter-spacing: 0;
  text-transform: none;
}
.editor-col h2 .h2-help:hover{
  border-color: var(--accent);
  color: var(--accent);
  transform: scale(1.08);
}
.editor-col h2 .h2-help:active{ transform: scale(.95); }

.section-title{
  font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase;
  color: rgba(255,255,255,.4); font-weight: 700;
  margin: 20px 0 10px; padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.section-title:first-of-type{ margin-top: 0; }
.field{ display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.field label{
  font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase;
  color: rgba(255,255,255,.45); font-weight: 700;
}
.field input, .field select, .field textarea{
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 8px; padding: 9px 11px;
  color: #fff; font-family: inherit; font-size: 13px;
  outline: none; transition: border-color .2s, background .2s; width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color: var(--accent); background: rgba(145,70,255,.06);
}
.field input:disabled, .field textarea:disabled{
  opacity: .5;
  cursor: not-allowed;
}
.field textarea{
  resize: vertical; min-height: 64px;
  font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; line-height: 1.55;
}
.field small{ font-size: 11px; color: rgba(255,255,255,.35); line-height: 1.4; }
.comp-item{
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px; padding: 12px 14px 4px;
  margin-bottom: 12px;
  transition: border-color .2s, background .2s, box-shadow .2s, opacity .2s;
  position: relative;
}
.comp-item:hover{ border-color: rgba(255,255,255,.13); }
.comp-item.is-divider{
  background: rgba(145,70,255,.05);
  border-color: rgba(145,70,255,.2);
}
.comp-item.is-divider:hover{
  border-color: rgba(145,70,255,.4);
}
.comp-item.dragging{
  opacity: .35;
  border-color: var(--accent);
  border-style: dashed;
}
.comp-item.selected{
  border-color: var(--accent);
  background: rgba(145,70,255,.09);
  box-shadow: 0 0 0 1px var(--accent), 0 0 20px -4px var(--accent-soft);
}
.comp-item.selected.is-divider{
  background: rgba(145,70,255,.14);
}
.editor-col.selection-mode .comp-item{
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.editor-col.selection-mode .comp-item:hover{
  border-color: var(--accent);
}
.editor-col.selection-mode .comp-item *{
  pointer-events: none;
}
.editor-col.selection-mode .comp-item .drag-handle,
.editor-col.selection-mode .comp-item .comp-head button{
  pointer-events: auto;
}
.selection-badge{
  position: absolute;
  top: 8px; right: 8px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-fg);
  font-size: 12px;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 5;
  font-family: inherit;
  box-shadow: 0 0 10px var(--accent-soft);
}
.comp-item.selected .selection-badge{ display: flex; }
.selection-bar{
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: #1e1530;
  border: 1px solid var(--accent-line);
  border-radius: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: -18px;
  z-index: 50;
  box-shadow: 0 6px 20px rgba(0,0,0,.55), 0 0 0 4px #14101e;
}
.selection-bar.active{ display: flex; }
.selection-bar .sel-info{
  font-size: 12px;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: .5px;
  margin-right: auto;
}
.selection-bar .sel-info span{
  color: #fff;
}
.selection-bar button{
  padding: 6px 12px;
  border-radius: 6px;
  background: rgba(0,0,0,.25);
  border: 1px solid rgba(255,255,255,.15);
  color: #e8e6f0;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .3px;
}
.selection-bar button:hover{
  border-color: var(--accent);
  color: var(--accent);
}
.selection-bar button:disabled{
  opacity: .35;
  cursor: not-allowed;
}
.comp-head{ display: flex; align-items: center; gap: 6px; margin-bottom: 12px; position: relative; z-index: 3; }
.comp-head .num{
  font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(255,255,255,.35); font-weight: 700; margin-right: auto;
}
.comp-item.is-divider .comp-head .num{
  color: rgba(145,70,255,.75);
}
.comp-head button{
  width: 28px; height: 28px; padding: 0; border-radius: 7px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  color: #c4c0d0; cursor: pointer; font-size: 14px; font-family: inherit;
  transition: all .15s; display: grid; place-items: center;
}
.comp-head button:hover{ border-color: var(--accent); color: var(--accent); transform: scale(1.05); }
.comp-head button:disabled{ opacity: .25; cursor: not-allowed; }
.comp-head button:disabled:hover{ border-color: rgba(255,255,255,.08); color: #c4c0d0; transform: none; }
.comp-head button.del:hover{ border-color: #f87171; color: #f87171; }

.drag-handle{
  width: 22px;
  height: 28px;
  padding: 0;
  display: grid;
  place-items: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: rgba(255,255,255,.25);
  cursor: grab;
  transition: color .15s, background .15s, border-color .15s;
  flex-shrink: 0;
  font-family: inherit;
  margin-left: -4px;
  touch-action: none;
}
.comp-item:hover .drag-handle{ color: rgba(255,255,255,.65); }
.drag-handle:hover{
  color: var(--accent);
  background: rgba(255,255,255,.06);
  border-color: rgba(255,255,255,.1);
}
.drag-handle:active{ cursor: grabbing; }
.drag-handle svg{
  width: 10px;
  height: 16px;
  display: block;
  fill: currentColor;
  pointer-events: none;
}
.editor-col.selection-mode .drag-handle{
  display: none;
}

.drop-indicator{
  height: 2px;
  margin: 4px 0;
  border-radius: 1px;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent), 0 0 4px var(--accent);
  animation: dropPulse 1.1s ease-in-out infinite;
  list-style: none;
}
@keyframes dropPulse{
  0%,100%{ opacity: 1; transform: scaleX(1); }
  50%{ opacity: .55; transform: scaleX(.98); }
}

.btn-primary{
  padding: 11px 16px; background: var(--accent); border: none;
  border-radius: 8px; color: var(--accent-fg); font-weight: 700; font-size: 13px;
  cursor: pointer; letter-spacing: .5px; transition: transform .1s, filter .2s;
  font-family: inherit; width: 100%;
}
.btn-primary:hover{ filter: brightness(1.12); }
.btn-primary:active{ transform: scale(.98); }
.btn-secondary{
  padding: 10px 16px; background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px; color: #c4c0d0; font-weight: 600;
  font-size: 12.5px; cursor: pointer; letter-spacing: .4px;
  transition: all .15s; font-family: inherit; width: 100%;
}
.btn-secondary:hover{ border-color: var(--accent); color: var(--accent); }
.btn-secondary.active{
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
  font-weight: 700;
}
.btn-row{ display: flex; gap: 8px; margin-top: 10px; }
.btn-row > *{ flex: 1; width: auto; }
.btn-icon{
  flex: 0 0 auto !important;
  width: 42px;
  height: 42px;
  padding: 0;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px;
  color: #c4c0d0;
  cursor: pointer;
  transition: all .15s;
  font-family: inherit;
}
.btn-icon:hover{
  border-color: var(--accent);
  color: var(--accent);
}
.btn-icon:active{ transform: scale(.95); }
.btn-icon svg{ width: 18px; height: 18px; display: block; }
.empty-hint{
  padding: 20px 14px;
  border: 1px dashed rgba(255,255,255,.1);
  border-radius: 10px; text-align: center;
  color: rgba(255,255,255,.35); font-size: 12.5px; line-height: 1.5;
  margin-bottom: 12px;
}
.pc-widget{
  display: inline-block; min-width: 300px; max-width: 380px; padding: 13px;
  border-radius: var(--radius);
  background: rgba(18, 14, 26, .78);
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 12px 34px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.02);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  animation: pcFade .45s ease both;
  transition: background .5s ease, border-color .5s ease, box-shadow .5s ease;
  position: relative; overflow: hidden;
}
@keyframes pcFade{ from{ opacity: 0; transform: translateY(10px); } to{ opacity: 1; transform: none; } }
#matrixRain{ position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 0; opacity: .55; mix-blend-mode: screen; }
body.matrix-mode #matrixRain{ display: block; }
.pc-head, .pc-body{ position: relative; z-index: 2; }
body.amber-mode{ --accent: #FFB000; --accent-soft: rgba(255,176,0,.16); --accent-line: rgba(255,176,0,.42); --accent-fg: #000; }
body.amber-mode .pc-widget{
  font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  background: rgba(20, 10, 0, .94); border-color: rgba(255,176,0,.28);
  box-shadow: 0 12px 34px rgba(0,0,0,.75), 0 0 44px rgba(255,176,0,.18), inset 0 0 0 1px rgba(255,176,0,.10);
}
body.amber-mode .pc-widget::after{
  content:''; position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom, rgba(255,176,0,.05) 0px, rgba(255,176,0,.05) 1px, transparent 1px, transparent 3px);
  pointer-events: none; z-index: 5;
  animation: amberScan 10s linear infinite; mix-blend-mode: screen;
}
@keyframes amberScan{ from{ background-position-y: 0; } to{ background-position-y: 60px; } }
body.amber-mode .pc-title{ color: #ffe3a3; letter-spacing: 2.4px; text-shadow: 0 0 6px rgba(255,176,0,.9), 0 0 16px rgba(255,176,0,.5); animation: amberFlicker 5.4s steps(1, end) infinite; }
@keyframes amberFlicker{
  0%, 88%, 100%{ opacity: 1; text-shadow: 0 0 6px rgba(255,176,0,.9), 0 0 16px rgba(255,176,0,.5); }
  89%{ opacity: .35; text-shadow: none; } 90%{ opacity: 1; }
  91%{ opacity: .55; text-shadow: 0 0 4px rgba(255,176,0,.6); } 92%{ opacity: 1; } 95%{ opacity: .78; }
}
body.amber-mode .pc-head{ border-bottom-color: rgba(255,176,0,.22); }
body.amber-mode .pc-dot{ box-shadow: 0 0 16px var(--accent); animation: amberDot 3.2s ease-in-out infinite; }
@keyframes amberDot{ 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.25);opacity:.75;} }
body.amber-mode .pc-value{ color: #ffefc8; text-shadow: 0 0 5px rgba(255,176,0,.3); }
body.amber-mode .pc-label{ color: rgba(255,176,0,.62); letter-spacing: 1.4px; }
body.amber-mode .pc-detail-k{ color: rgba(255,176,0,.58); }
body.amber-mode .pc-detail-v{ color: #ffefc8; }
body.amber-mode .pc-ico{ box-shadow: inset 0 0 8px rgba(255,176,0,.2), 0 0 10px -2px rgba(255,176,0,.5); }
body.amber-mode .pc-row{ background: rgba(60, 30, 0, .3); }
body.vaporwave-mode{ --accent: #FF2E97; --accent-soft: rgba(255,46,151,.16); --accent-line: rgba(255,46,151,.42); --accent-fg: #000; }
body.vaporwave-mode .pc-widget{
  background: linear-gradient(135deg, rgba(35,5,50,.94), rgba(12,5,32,.94));
  border-color: rgba(255,46,151,.32);
  box-shadow: 0 12px 34px rgba(0,0,0,.7), 0 0 40px rgba(255,46,151,.22), 0 0 80px rgba(0,229,255,.10), inset 0 0 0 1px rgba(255,46,151,.12);
}
body.vaporwave-mode .pc-widget::after{
  content:''; position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom, rgba(255,46,151,.04) 0px, rgba(255,46,151,.04) 1px, transparent 1px, transparent 5px);
  pointer-events: none; z-index: 5;
  animation: scanMoveVapor 14s linear infinite; mix-blend-mode: screen;
}
@keyframes scanMoveVapor{ from{ background-position-y: 0; } to{ background-position-y: 80px; } }
body.vaporwave-mode .pc-title{ color: #fff; font-style: italic; letter-spacing: 2.6px; animation: vaporFlicker 6.5s steps(1, end) infinite; }
@keyframes vaporFlicker{
  0%, 82%, 100%{ opacity: 1; text-shadow: -1px 0 0 rgba(0,229,255,.85), 1px 0 0 rgba(255,46,151,.85), 0 0 14px rgba(255,46,151,.5); }
  83%{ opacity: .3; text-shadow: -1px 0 0 rgba(0,229,255,.4), 1px 0 0 rgba(255,46,151,.4); }
  84%{ opacity: 1; }
  85%{ opacity: .55; text-shadow: -2px 0 0 rgba(0,229,255,.9), 2px 0 0 rgba(255,46,151,.9), 0 0 20px rgba(255,46,151,.7); }
  86%{ opacity: 1; }
}
body.vaporwave-mode .pc-head{ border-bottom-color: rgba(255,46,151,.22); }
body.vaporwave-mode .pc-dot{ background: linear-gradient(135deg, #FF2E97, #00E5FF); box-shadow: 0 0 10px #FF2E97, 0 0 18px rgba(0,229,255,.5); animation: vaporDot 4s ease-in-out infinite; }
@keyframes vaporDot{ 0%,100%{ opacity:1; box-shadow: 0 0 10px #FF2E97, 0 0 18px rgba(0,229,255,.5); } 50%{ opacity:.7; box-shadow: 0 0 6px #FF2E97, 0 0 10px rgba(0,229,255,.3); } }
body.vaporwave-mode .pc-value{ color: #ffe6f4; text-shadow: 0 0 6px rgba(255,46,151,.25); }
body.vaporwave-mode .pc-label{ color: rgba(0,229,255,.6); letter-spacing: 1.4px; }
body.vaporwave-mode .pc-detail-k{ color: rgba(0,229,255,.55); }
body.vaporwave-mode .pc-detail-v{ color: #ffe6f4; }
body.vaporwave-mode .pc-ico{ box-shadow: inset 0 0 8px rgba(255,46,151,.15), 0 0 10px -2px rgba(0,229,255,.35); }
body.matrix-mode{ --accent: #39FF14; --accent-soft: rgba(57,255,20,.16); --accent-line: rgba(57,255,20,.42); --accent-fg: #000; }
body.matrix-mode .pc-widget{
  font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  background: rgba(0, 6, 0, .94); border-color: rgba(57,255,20,.28);
  box-shadow: 0 12px 34px rgba(0,0,0,.8), 0 0 44px rgba(57,255,20,.16), inset 0 0 0 1px rgba(57,255,20,.10);
}
body.matrix-mode .pc-title{ color: #b6ffb6; letter-spacing: 2.4px; animation: matrixFlicker 4s steps(1, end) infinite; }
@keyframes matrixFlicker{
  0%, 90%, 100%{ opacity: 1; text-shadow: 0 0 6px rgba(57,255,20,.9), 0 0 16px rgba(57,255,20,.5); }
  91%{ opacity: .3; text-shadow: none; } 92%{ opacity: 1; }
  94%{ opacity: .6; text-shadow: 0 0 4px rgba(57,255,20,.7), 0 0 10px rgba(57,255,20,.4); }
  95%{ opacity: 1; }
  97%{ opacity: .85; text-shadow: 0 0 6px rgba(57,255,20,.9); } 98%{ opacity: 1; }
}
body.matrix-mode .pc-head{ border-bottom-color: rgba(57,255,20,.22); }
body.matrix-mode .pc-dot{ box-shadow: 0 0 16px var(--accent); animation: dotPulse 1.6s ease-in-out infinite; }
@keyframes dotPulse{ 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.4);opacity:.6;} }
body.matrix-mode .pc-value{ color: #d6ffd0; text-shadow: 0 0 5px rgba(57,255,20,.35); }
body.matrix-mode .pc-label{ color: rgba(57,255,20,.65); letter-spacing: 1.4px; }
body.matrix-mode .pc-detail-k{ color: rgba(57,255,20,.6); }
body.matrix-mode .pc-detail-v{ color: #d6ffd0; }
body.matrix-mode .pc-ico{ box-shadow: inset 0 0 8px rgba(57,255,20,.18), 0 0 10px -2px rgba(57,255,20,.5); }
body.matrix-mode .pc-row{ background: rgba(0, 40, 0, .28); }
body.amber-mode .pc-head:hover .pc-title,
body.vaporwave-mode .pc-head:hover .pc-title,
body.matrix-mode .pc-head:hover .pc-title{ animation-play-state: paused; opacity: 1; }
.pc-head{
  display: flex; align-items: center; gap: 8px;
  padding: 2px 4px 10px; margin-bottom: 9px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  cursor: pointer;
  transition: border-color .25s ease, margin-bottom .25s ease, padding-bottom .25s ease;
}
.pc-head:hover .pc-title{ color: #fff; }
body.amber-mode .pc-head:hover .pc-title{ color: #ffe3a3; text-shadow: 0 0 8px #FFB000, 0 0 22px rgba(255,176,0,.9); }

.pc-info{ flex: 1; min-width: 0; line-height: 1.28; }

.color-popup .cp-hex-row{
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 8px; padding: 7px 10px; margin-bottom: 10px;
  transition: border-color .2s;
}
.color-popup .cp-hex-row:focus-within{ border-color: var(--accent); background: rgba(145,70,255,.06); }
.color-popup .cp-hex-preview{
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.15);
  flex-shrink: 0; transition: background .2s;
}
.color-popup .cp-hex-hash{ color: rgba(255,255,255,.4); font-size: 13px; font-family: 'Consolas', 'Monaco', monospace; }
.color-popup .cp-hex-input{
  flex: 1; background: transparent; border: none; outline: none;
  color: #fff; font-family: 'Consolas', 'Monaco', monospace;
  font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
  padding: 0; min-width: 0;
}
.color-popup .cp-actions{ display: flex; gap: 6px; }
.color-popup .cp-btn{
  flex: 1; padding: 8px 12px; border-radius: 7px;
  font-family: inherit; font-size: 12px; font-weight: 600;
  cursor: pointer; letter-spacing: .3px; transition: all .15s;
  border: 1px solid transparent;
}
.color-popup .cp-btn-cancel{
  background: rgba(255,255,255,.05);
  border-color: rgba(255,255,255,.1); color: #c4c0d0;
}
.color-popup .cp-btn-cancel:hover{ border-color: #666; color: #fff; }
.color-popup .cp-btn-apply{ background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.color-popup .cp-btn-apply:hover{ filter: brightness(1.12); }
</style>

let currentLang = 'ru';
const STORAGE_LANG_KEY = 'fnk3d-pcspecs-lang';

function t(key){
  return (L[currentLang] && L[currentLang][key]) || (L.ru[key]) || key;
}

function detectLang(){
  try {
    const saved = localStorage.getItem(STORAGE_LANG_KEY);
    if (saved === 'ru' || saved === 'en') return saved;
  } catch(e){}
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('ru') || nav.startsWith('uk') || nav.startsWith('be') || nav.startsWith('kk')) return 'ru';
  return 'en';
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;

  const idMap = [
    ['iconModalTitle', 'iconModalTitle'],
    ['cpTitle',        'colorPopupTitle'],
    ['cpCancel',       'colorPopupCancel'],
    ['cpApply',        'colorPopupApply'],
    ['helpModalTitle', 'helpTitle']
  ];
  idMap.forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) el.textContent = t(key);
  });

  const iconSearchInput = document.getElementById('iconSearchInput');
  if (iconSearchInput) iconSearchInput.placeholder = t('iconSearchPh');

  const iconModalClose = document.getElementById('iconModalClose');
  if (iconModalClose) iconModalClose.title = t('iconModalClose');

  const helpModalClose = document.getElementById('helpModalClose');
  if (helpModalClose) helpModalClose.title = t('helpClose');

  const helpModalBody = document.getElementById('helpModalBody');
  if (helpModalBody) helpModalBody.innerHTML = t('helpContent');

  if (iconModal && iconModal.classList.contains('open')){
    renderIconCategories();
    renderIconGrid();
  }

  if (IS_EDITOR) renderEditor();

  try { localStorage.setItem(STORAGE_LANG_KEY, lang); } catch(e){}
}

const IS_EDITOR = (window.IS_EDITOR !== false);
const STORAGE_KEY = 'fnk3d-pcspecs-v3';

let state;
let collapsed;
let selectionMode = false;
let selectedIndices = new Set();

function loadState(){
  if (!IS_EDITOR){
    state = JSON.parse(JSON.stringify(window.EMBEDDED_CONFIG || DEFAULT_CONFIG));
    collapsed = false;
    return;
  }
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && parsed.config && Array.isArray(parsed.config.components)){
        state = Object.assign({}, DEFAULT_CONFIG, parsed.config);
        if (typeof state.customColor !== 'string') state.customColor = '';
        collapsed = parsed.collapsed === true;
        return;
      }
    }
  } catch(e){}
  state = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  collapsed = true;
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      config: state,
      collapsed: collapsed
    }));
  } catch(e){}
}

loadState();

   ============================================================ */
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function hexToRgba(hex, a){
  if (!hex || typeof hex !== 'string') return 'rgba(145,70,255,' + a + ')';
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const n = parseInt(hex, 16);
  if (isNaN(n)) return 'rgba(145,70,255,' + a + ')';
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function icon(type){
  const body = ICONS[type] || ICONS.chip;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

/* ★ NEW: яркость цвета. Возвращает '#000' или '#fff' — для текста поверх акцента */
function contrastFg(hex){
  if (!hex || typeof hex !== 'string') return '#000';
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  if (hex.length !== 6 || !/^[0-9A-Fa-f]{6}$/.test(hex)) return '#000';
  const r = parseInt(hex.substr(0,2), 16);
  const g = parseInt(hex.substr(2,2), 16);
  const b = parseInt(hex.substr(4,2), 16);
  // Relative luminance (sRGB), порог 0.55 для комфортного контраста
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  return lum > 0.55 ? '#000' : '#fff';
}

function applyAccent(color){
  state.accent = color;
  const root = document.documentElement;
  root.style.setProperty('--accent', color);
  root.style.setProperty('--accent-soft', hexToRgba(color, .16));
  root.style.setProperty('--accent-line', hexToRgba(color, .34));
  root.style.setProperty('--accent-fg', contrastFg(color)); // ★ NEW
  refreshDotActiveStates();
}
function refreshDotActiveStates(){
  document.querySelectorAll('.pc-dot-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.color.toLowerCase() === state.accent.toLowerCase());
  });
  document.querySelectorAll('.pc-custom-dot.has-color').forEach(dot => {
    const c = dot.dataset.color;
    if (c) dot.classList.toggle('active', c.toLowerCase() === state.accent.toLowerCase());
  });
}
function isValidHex(s){
  return /^[0-9A-Fa-f]{6}$/.test(String(s || '').replace('#',''));
}
function normalizeHex(s){
  s = String(s || '').replace('#','').trim();
  if (!isValidHex(s)) return null;
  return '#' + s.toUpperCase();
}

  '#AF52DE', '#FF2D55', '#A2845E', '#8E8E93', '#1C1C1E', '#2C2C2E', '#48484A', '#636366',

const colorPopup = document.getElementById('colorPopup');

const cpHexInput = document.getElementById('cpHexInput');
const cpApply = document.getElementById('cpApply');

let cpAnchor = null;
let cpCallback = null;
let cpCurrentHex = '#9146FF';

function renderCpSwatches(){
  if (!cpSwatches) return;
  cpSwatches.innerHTML = PRESET_COLORS.map(hex => {
    const sel = hex.toLowerCase() === cpCurrentHex.toLowerCase() ? ' selected' : '';
    return `<button type="button" class="cp-swatch${sel}" data-hex="${hex}" style="background:${hex}" title="${hex}"></button>`;
  }).join('');
}
function updateCpHexDisplay(){
  if (cpHexPreview) cpHexPreview.style.background = cpCurrentHex;
  if (cpHexInput) cpHexInput.value = cpCurrentHex.replace('#','').toUpperCase();
}
function openColorPopup(anchor, callback, initialHex){
  if (!anchor || !colorPopup) return;
  cpAnchor = anchor;
  cpCallback = callback;
  // ★ NEW: 3rd arg — можно передать стартовый цвет (для редактирования кастомного)
  cpCurrentHex = initialHex || state.customColor || state.accent || '#9146FF';
  renderCpSwatches();
  updateCpHexDisplay();
  colorPopup.classList.add('open');
  positionColorPopup();
  setTimeout(() => { if (cpHexInput){ cpHexInput.focus(); cpHexInput.select(); } }, 50);
}
function positionColorPopup(){
  if (!cpAnchor || !colorPopup) return;
  const rect = cpAnchor.getBoundingClientRect();
  const popupW = 252;
  const popupH = colorPopup.offsetHeight || 200;
  let left = rect.left;
  let top = rect.bottom + 8;
  if (left + popupW > window.innerWidth - 12) left = window.innerWidth - popupW - 12;
  if (left < 12) left = 12;
  if (top + popupH > window.innerHeight - 12){
    top = rect.top - popupH - 8;
    if (top < 12) top = rect.bottom + 8;
  }
  colorPopup.style.left = left + 'px';
  colorPopup.style.top = top + 'px';
}
function closeColorPopup(){
  if (colorPopup) colorPopup.classList.remove('open');
  cpAnchor = null;
  cpCallback = null;
}
function applyColorFromPopup(){
  const hex = normalizeHex(cpHexInput ? cpHexInput.value : '');
  if (!hex){
    if (cpHexInput){
      cpHexInput.style.color = '#f87171';
      setTimeout(() => { if (cpHexInput) cpHexInput.style.color = ''; }, 400);
    }
    return;
  }
  if (cpCallback) cpCallback(hex);
  closeColorPopup();
}

function renderWidget(){
  const widget = document.getElementById('widget');
  const canvasEl = document.getElementById('matrixRain');
  widget.innerHTML = '';
  widget.appendChild(canvasEl);

  const isEmpty = state.components.length === 0;

  let themeDots = state.colors.map(c =>
    `<button class="pc-dot-btn" type="button"
             data-color="${c.hex}" title="${c.name}"
             style="--c:${c.hex}"></button>`
  ).join('');

  if (state.customColor && state.customColor.trim()){
    themeDots += `<button class="pc-custom-dot has-color" type="button"
                    data-color="${esc(state.customColor)}"
                    title="${esc(state.customColor)}"
                    style="background:${esc(state.customColor)};color:${esc(state.customColor)}"></button>`;
  }

  const head = state.title ? `
    <div class="pc-head" id="pcHead" role="button" tabindex="0">
      <span class="pc-dot"></span>
      <span class="pc-title" id="pcTitle">${esc(state.title)}</span>
      <div class="pc-theme">${themeDots}</div>
      <span class="pc-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </span>
    </div>` : '';

  const rows = state.components.map((c, idx) => {
    if (c.type === 'divider'){
      const lbl = (c.label || '').trim();
      const hasLbl = lbl !== '';
      return `<div class="pc-divider${hasLbl ? '' : ' no-label'}" data-idx="${idx}">
        ${hasLbl ? `<span class="pc-divider-label">${esc(lbl)}</span>` : ''}
      </div>`;
    }

    const hasLabel   = c.label && c.label.trim() !== '';
    const hasDetails = Array.isArray(c.details) && c.details.length > 0;
    const hasLink    = c.url && c.url.trim() !== '';
    const pulseDelay = state.pulseIcons
      ? `--pulse-delay:${(idx % 2) * 1.6}s;`
      : `--pulse-state:paused;`;

    const chevronHtml = hasDetails ? `
      <span class="pc-row-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </span>` : '';

    const detailsHtml = hasDetails ? `
      <div class="pc-details">
        <div class="pc-details-clip">
          <div class="pc-detail-list">
            ${c.details.map(([k, v]) => `
              <div class="pc-detail-row">
                <span class="pc-detail-k">${esc(k)}</span>
                <span class="pc-detail-v">${esc(v)}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>` : '';

    const extLinkHtml = hasLink ? `<span class="pc-ext-link" aria-hidden="true">🔗</span>` : '';

    return `
      <div class="pc-item${hasDetails ? ' expandable' : ''}${hasLink ? ' has-link' : ''}" data-idx="${idx}"${hasLink ? ` data-url="${esc(c.url)}"` : ''}>
        <div class="pc-row${hasLabel ? '' : ' compact'}">
          <div class="pc-ico" style="${pulseDelay}">${icon(c.type)}</div>
          <div class="pc-info">
            ${hasLabel ? `<div class="pc-label">${esc(c.label)}</div>` : ''}
            <div class="pc-value">${esc(c.value)}</div>
          </div>
          ${extLinkHtml}
          ${chevronHtml}
        </div>
        ${detailsHtml}
      </div>`;
  }).join('');

  widget.insertAdjacentHTML('beforeend', head +
    `<div class="pc-body" id="pcBody"><div class="pc-list">${rows}</div></div>`);

  if (isEmpty){
    widget.classList.add('collapsed');
  } else {
    widget.classList.toggle('collapsed', collapsed);
  }

  attachWidgetHandlers();
  refreshDotActiveStates();
}

function attachWidgetHandlers(){
  const widget = document.getElementById('widget');

  widget.querySelectorAll('.pc-dot-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (document.body.classList.contains('amber-mode'))     return;
      if (document.body.classList.contains('vaporwave-mode')) return;
      if (document.body.classList.contains('matrix-mode'))    return;
      applyAccent(btn.dataset.color);
      saveState();
      if (IS_EDITOR) renderEditor();
    });
  });

  widget.querySelectorAll('.pc-custom-dot.has-color').forEach(dot => {
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      if (document.body.classList.contains('amber-mode'))     return;
      if (document.body.classList.contains('vaporwave-mode')) return;
      if (document.body.classList.contains('matrix-mode'))    return;
      applyAccent(dot.dataset.color);
      saveState();
      if (IS_EDITOR) renderEditor();
    });
  });

  const headEl = document.getElementById('pcHead');
  if (headEl){
    headEl.addEventListener('click', (e) => {
      if (e.target.closest('.pc-dot-btn') || e.target.closest('.pc-custom-dot')) return;
      if (state.components.length === 0) return;
      widget.classList.toggle('collapsed');
      collapsed = widget.classList.contains('collapsed');
      saveState();
    });
  }

  widget.querySelectorAll('.pc-item').forEach(item => {
    const row = item.querySelector('.pc-row');
    const ico = row.querySelector('.pc-ico');
    const chevron = row.querySelector('.pc-row-chevron');
    const url = item.dataset.url || '';

    row.addEventListener('mouseenter', () => row.classList.add('tilting'));
    row.addEventListener('mousemove', (e) => {
      const rect = row.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top)  / rect.height;
      const x  = px - 0.5;
      const y  = py - 0.5;
      row.style.transform = `perspective(700px) rotateX(${(-y * 7).toFixed(2)}deg) rotateY(${(x * 7).toFixed(2)}deg) scale(1.01)`;
      row.style.setProperty('--mx', (px * 100).toFixed(2) + '%');
      row.style.setProperty('--my', (py * 100).toFixed(2) + '%');
      ico.style.transform = `translate3d(${(x * -6).toFixed(2)}px, ${(y * -6).toFixed(2)}px, 0)`;
    });
    row.addEventListener('mouseleave', () => {
      row.classList.remove('tilting');
      row.style.transform = '';
      ico.style.transform = '';
      row.style.setProperty('--mx', '50%');
      row.style.setProperty('--my', '50%');
    });

    if (chevron && item.classList.contains('expandable')){
      chevron.addEventListener('click', (e) => {
        e.stopPropagation();
        item.classList.toggle('open');
      });
    }

    if (url){
      row.addEventListener('click', () => {
        window.open(url, '_blank', 'noopener,noreferrer');
      });
    } else if (item.classList.contains('expandable')){
      row.addEventListener('click', () => item.classList.toggle('open'));
    }
  });
}

/* ============================================================
   SELECTION HELPERS
   ============================================================ */
function isSelectionContiguous(){
  if (selectedIndices.size <= 1) return true;
  const sorted = [...selectedIndices].sort((a,b) => a - b);
  return (sorted[sorted.length - 1] - sorted[0]) === (sorted.length - 1);
}

function applySelectionVisual(){
  const items = document.querySelectorAll('#ed-comps .comp-item');
  items.forEach((item, i) => {
    item.classList.toggle('selected', selectedIndices.has(i));
  });
  const cnt = document.getElementById('selCount');
  if (cnt) cnt.textContent = String(selectedIndices.size);

  const upBtn = document.getElementById('selUp');
  const downBtn = document.getElementById('selDown');
  const delBtn = document.getElementById('selDel');

  const contiguous = isSelectionContiguous();
  const sorted = [...selectedIndices].sort((a,b) => a - b);
  const canUp = contiguous && selectedIndices.size > 0 && sorted[0] > 0;
  const canDown = contiguous && selectedIndices.size > 0 && sorted[sorted.length - 1] < state.components.length - 1;
  const canDel = selectedIndices.size > 0;

  if (upBtn) upBtn.disabled = !canUp;
  if (downBtn) downBtn.disabled = !canDown;
  if (delBtn) delBtn.disabled = !canDel;
}

function selectAllCards(){
  selectedIndices = new Set();
  state.components.forEach((_, i) => selectedIndices.add(i));
  applySelectionVisual();
}
function deselectAllCards(){
  selectedIndices = new Set();
  applySelectionVisual();
}
function moveSelection(dir){
  if (!isSelectionContiguous() || selectedIndices.size === 0) return;
  const sorted = [...selectedIndices].sort((a,b) => a - b);
  const first = sorted[0];
  const last = sorted[sorted.length - 1];

  if (dir === 'up'){
    if (first === 0) return;
    const top = state.components[first - 1];
    state.components.splice(first - 1, 1);
    state.components.splice(last, 0, top);
    selectedIndices = new Set(sorted.map(i => i - 1));
  } else {
    if (last === state.components.length - 1) return;
    const bottom = state.components[last + 1];
    state.components.splice(last + 1, 1);
    state.components.splice(first, 0, bottom);
    selectedIndices = new Set(sorted.map(i => i + 1));
  }
  saveState();
  renderEditor();
  renderWidget();
}
function deleteSelection(){
  if (selectedIndices.size === 0) return;
  const sorted = [...selectedIndices].sort((a,b) => b - a);
  sorted.forEach(i => state.components.splice(i, 1));
  selectedIndices = new Set();
  saveState();
  renderEditor();
  renderWidget();
}

/* ============================================================
   DRAG & DROP
   ============================================================ */
let dragState = null;
let pendingCardDrag = null;

function updateDragPosition(clientY){
  if (!dragState) return;
  const { items, fromIndex, container, indicator, isGroup, groupIndices } = dragState;
  const rects = items.map(it => it.getBoundingClientRect());

  let targetIndex = items.length;
  for (let i = 0; i < items.length; i++){
    const rect = rects[i];
    const mid = rect.top + rect.height / 2;
    if (clientY < mid){ targetIndex = i; break; }
  }

  let isHome = false;
  if (isGroup){
    const sorted = [...groupIndices].sort((a,b) => a - b);
    if (targetIndex === sorted[0] || targetIndex === sorted[sorted.length - 1] + 1){
      isHome = true;
    }
  } else {
    isHome = (targetIndex === fromIndex) || (targetIndex === fromIndex + 1);
  }

  if (isHome){
    if (indicator.parentNode) indicator.parentNode.removeChild(indicator);
    dragState.currentTarget = -1;
    return;
  }

  dragState.currentTarget = targetIndex;
  let insertBeforeEl = targetIndex < items.length ? items[targetIndex] : null;
  if (insertBeforeEl) container.insertBefore(indicator, insertBeforeEl);
  else container.appendChild(indicator);
}

function doAutoScroll(clientY){
  const ed = document.getElementById('editor');
  if (!ed) return;
  const rect = ed.getBoundingClientRect();
  const threshold = 70;
  const speed = 10;
  if (clientY < rect.top + threshold) ed.scrollTop -= speed;
  else if (clientY > rect.bottom - threshold) ed.scrollTop += speed;
}

function onDragMove(e){
  if (!dragState) return;
  if (e.pointerId !== dragState.pointerId) return;
  updateDragPosition(e.clientY);
  doAutoScroll(e.clientY);
}

function onDragEnd(e){
  if (!dragState) return;
  if (e.pointerId !== dragState.pointerId) return;

  const { fromIndex, currentTarget, items, indicator, isGroup, groupIndices } = dragState;
  if (indicator && indicator.parentNode) indicator.parentNode.removeChild(indicator);
  document.body.classList.remove('dragging-comp');
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
  items.forEach(it => it.classList.remove('dragging'));

  const noChange = (currentTarget === -1);
  dragState = null;

  if (noChange) return;

  if (isGroup){
    const sorted = [...groupIndices].sort((a,b) => a - b);
    const group = sorted.map(i => state.components[i]);

    const remaining = [];
    state.components.forEach((c, i) => {
      if (!groupIndices.has(i)) remaining.push(c);
    });

    const remainingItems = items.filter((_, i) => !groupIndices.has(i));
    let insertPos = remaining.length;
    for (let i = 0; i < remainingItems.length; i++){
      const rect = remainingItems[i].getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (e.clientY < mid){ insertPos = i; break; }
    }

    const newComps = [];
    for (let i = 0; i < remaining.length; i++){
      if (i === insertPos) group.forEach(c => newComps.push(c));
      newComps.push(remaining[i]);
    }
    if (insertPos === remaining.length) group.forEach(c => newComps.push(c));

    state.components = newComps;

    const newSelected = new Set();
    for (let i = 0; i < group.length; i++) newSelected.add(insertPos + i);
    selectedIndices = newSelected;

    saveState();
    renderEditor();
    renderWidget();
    return;
  }

  let toIndex = currentTarget;
  if (toIndex > fromIndex) toIndex--;
  const [moved] = state.components.splice(fromIndex, 1);
  state.components.splice(toIndex, 0, moved);
  saveState();
  renderEditor();
  renderWidget();
}

function startDrag(e, item, index, container){
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  e.preventDefault();
  e.stopPropagation();

  const items = Array.from(container.querySelectorAll('.comp-item'));
  const handle = e.currentTarget;
  const indicator = document.createElement('div');
  indicator.className = 'drop-indicator';

  dragState = {
    fromIndex: index,
    items, container, indicator,
    currentTarget: -1,
    pointerId: e.pointerId,
    isGroup: false,
    groupIndices: null
  };

  try { handle.setPointerCapture(e.pointerId); } catch(err){}
  item.classList.add('dragging');
  document.body.classList.add('dragging-comp');

  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
}

function startGroupDrag(e, container){
  e.preventDefault();
  e.stopPropagation();

  const items = Array.from(container.querySelectorAll('.comp-item'));
  const indicator = document.createElement('div');
  indicator.className = 'drop-indicator';

  const groupIndices = new Set(selectedIndices);

  dragState = {
    fromIndex: -1,
    items, container, indicator,
    currentTarget: -1,
    pointerId: e.pointerId,
    isGroup: true,
    groupIndices
  };

  items.forEach((it, i) => {
    if (groupIndices.has(i)) it.classList.add('dragging');
  });
  document.body.classList.add('dragging-comp');

  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
}

function detailsToText(details){
  return (details || []).map(([k, v]) => `${k} | ${v}`).join('\n');
}
function textToDetails(text){
  return String(text || '')
    .split('\n')
    .map(l => l.trim())
    .filter(Boolean)
    .map(line => {
      const parts = line.split('|');
      if (parts.length < 2) return [parts[0].trim(), ''];
      return [parts[0].trim(), parts.slice(1).join('|').trim()];
    });
}

    if (selectionMode && selectedIndices.has(i) && (act === 'up' || act === 'down')){

    if (act === 'pick-icon'){

        state.components[i].type = newType;

        renderWidget();
      });
      return;

    if (act === 'up' && i > 0){
      [state.components[i-1], state.components[i]] = [state.components[i], state.components[i-1]];
    } else if (act === 'down' && i < state.components.length - 1){
      [state.components[i+1], state.components[i]] = [state.components[i], state.components[i+1]];
    } else if (act === 'del'){
      state.components.splice(i, 1);
    } else return;
    saveState();
    renderEditor();
    renderWidget();
  });

  compsBox.querySelectorAll('.comp-item').forEach((item) => {
    const idx = parseInt(item.dataset.index, 10);

    const handle = item.querySelector('.drag-handle');
    if (handle && !selectionMode){
      handle.addEventListener('pointerdown', (e) => {
        startDrag(e, item, idx, compsBox);
      });
    }

    if (selectionMode){
      item.addEventListener('dblclick', (e) => {
        e.preventDefault();
        e.stopPropagation();
        deselectAllCards();
      });

      item.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        e.preventDefault();

        pendingCardDrag = {
          item, index: idx, container: compsBox,
          startX: e.clientX, startY: e.clientY,
          pointerId: e.pointerId
        };
        window.addEventListener('pointermove', onPendingMove);
        window.addEventListener('pointerup', onPendingUp);
        window.addEventListener('pointercancel', onPendingUp);
      });
    }
  });

  applySelectionVisual();
  applyAccent(state.accent);
}

function onPendingMove(e){
  if (!pendingCardDrag) return;
  if (e.pointerId !== pendingCardDrag.pointerId) return;
  const dx = e.clientX - pendingCardDrag.startX;
  const dy = e.clientY - pendingCardDrag.startY;
  if (Math.hypot(dx, dy) > 5){
    const { item, index, container } = pendingCardDrag;
    if (!selectedIndices.has(index)){
      selectedIndices = new Set([index]);
      applySelectionVisual();
    }
    window.removeEventListener('pointermove', onPendingMove);
    window.removeEventListener('pointerup', onPendingUp);
    window.removeEventListener('pointercancel', onPendingUp);
    pendingCardDrag = null;
    startGroupDrag(e, container);
  }
}

function onPendingUp(e){
  if (!pendingCardDrag) return;
  if (e.pointerId !== pendingCardDrag.pointerId) return;
  const { index } = pendingCardDrag;
  if (selectedIndices.has(index)){
    selectedIndices.delete(index);
  } else {
    selectedIndices.add(index);
  }
  window.removeEventListener('pointermove', onPendingMove);
  window.removeEventListener('pointerup', onPendingUp);
  window.removeEventListener('pointercancel', onPendingUp);
  pendingCardDrag = null;
  applySelectionVisual();
}

/* ============================================================
   MATRIX RAIN
   ============================================================ */
const canvas = document.getElementById('matrixRain');
const ctx = canvas.getContext('2d');
const CHARS = 'アカサタナハマヤラワイキシチニヒミリウクスツヌフムユルエケセテネヘメレオコソトノホモヨロン0123456789';
const FONT_SIZE = 12;
let cols = 0, drops = [], rafId = null, matrixActive = false;

function matrixResize(){
  const w = document.getElementById('widget');
  if (!w) return;
  const rect = w.getBoundingClientRect();
  canvas.width  = Math.max(1, Math.floor(rect.width));
  canvas.height = Math.max(1, Math.floor(rect.height));
  cols = Math.max(1, Math.floor(canvas.width / FONT_SIZE));
  drops = new Array(cols).fill(0).map(() => Math.random() * -60);
  ctx.fillStyle = 'rgba(0, 6, 0, 1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function matrixDraw(){
  ctx.fillStyle = 'rgba(0, 6, 0, 0.09)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = FONT_SIZE + 'px "Consolas", monospace';
  for (let i = 0; i < cols; i++){
    const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
    const x = i * FONT_SIZE;
    const y = drops[i] * FONT_SIZE;
    if (y > 0 && y < canvas.height){
      ctx.fillStyle = Math.random() < 0.06 ? '#d6ffd0' : '#39FF14';
      ctx.fillText(ch, x, y);
    }
    drops[i] += 0.55 + Math.random() * 0.55;
    if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
  }
  rafId = requestAnimationFrame(matrixDraw);
}
function matrixStart(){
  if (matrixActive) return;
  matrixActive = true;
  matrixResize();
  matrixDraw();
  window.addEventListener('resize', matrixResize);
}
function matrixStop(){
  if (!matrixActive) return;
  matrixActive = false;
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  window.removeEventListener('resize', matrixResize);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* ============================================================
   EASTER EGGS
   ============================================================ */
const KONAMI  = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','KeyB','KeyA'];
const IDDQD   = ['KeyI','KeyD','KeyD','KeyQ','KeyD'];
const REDPILL = ['KeyR','KeyE','KeyD','KeyP','KeyI','KeyL','KeyL'];
let konamiPos = 0, iddqdPos = 0, redpillPos = 0;
let currentMode = 'none';

function flashWidget(){
  const w = document.getElementById('widget');
  if (!w) return;
  w.style.transition = 'filter .15s ease';
  w.style.filter = 'brightness(2.4) contrast(1.4)';
  setTimeout(() => { w.style.filter = ''; }, 140);
}
function setMode(mode){
  document.body.classList.remove('amber-mode', 'vaporwave-mode', 'matrix-mode');
  if (mode !== 'matrix') matrixStop();
  if (mode === 'amber')     document.body.classList.add('amber-mode');
  if (mode === 'vaporwave') document.body.classList.add('vaporwave-mode');
  if (mode === 'matrix'){ document.body.classList.add('matrix-mode'); setTimeout(matrixStart, 30); }
  if (mode !== currentMode) flashWidget();
  currentMode = mode;
}
function toggleMode(mode){ setMode(currentMode === mode ? 'none' : mode); }

document.addEventListener('keydown', (e) => {
  if (helpModal && helpModal.classList.contains('open')){
    if (e.key === 'Escape'){ closeHelpModal(); return; }
  }
  if (colorPopup && colorPopup.classList.contains('open')){
    if (e.key === 'Escape'){ closeColorPopup(); return; }
  }
  if (iconModal && iconModal.classList.contains('open')){
    if (e.key === 'Escape'){ closeIconPicker(); return; }
  }
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
  if (tag === 'input' || tag === 'textarea') return;

  const code = e.code || '';
  if (code === KONAMI[konamiPos]){
    konamiPos++;
    if (konamiPos === KONAMI.length){ konamiPos = 0; e.preventDefault(); toggleMode('amber'); return; }
  } else konamiPos = (code === KONAMI[0]) ? 1 : 0;
  if (code === IDDQD[iddqdPos]){
    iddqdPos++;
    if (iddqdPos === IDDQD.length){ iddqdPos = 0; e.preventDefault(); toggleMode('vaporwave'); return; }
  } else iddqdPos = (code === IDDQD[0]) ? 1 : 0;
  if (code === REDPILL[redpillPos]){
    redpillPos++;
    if (redpillPos === REDPILL.length){ redpillPos = 0; e.preventDefault(); toggleMode('matrix'); return; }
  } else redpillPos = (code === REDPILL[0]) ? 1 : 0;
});

/* ============================================================
   JSON EXPORT / IMPORT
   ============================================================ */
function exportJSON(){
  try {
    const data = { version: 1, exported: new Date().toISOString(), config: state };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    const stamp = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
    a.href = url;
    a.download = 'pc-specs-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  } catch(e){ console.error(e); alert(t('exportError')); }
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      const config = parsed.config || parsed;
      if (!config || !Array.isArray(config.components)){
        alert(t('importErrorFormat')); return;
      }
      state = Object.assign({}, DEFAULT_CONFIG, config);
      if (typeof state.customColor !== 'string') state.customColor = '';
      selectionMode = false;
      selectedIndices = new Set();
      saveState();
      renderWidget();
      renderEditor();
      applyAccent(state.accent);
    } catch(err){ console.error(err); alert(t('importErrorRead') + err.message); }
  };
  reader.onerror = () => alert(t('importErrorFile'));
  reader.readAsText(file);
}

  const clonedBody = clone.querySelector('body');

    clonedBody.classList.remove('amber-mode', 'vaporwave-mode', 'matrix-mode', 'dragging', 'dragging-comp');
  }
  const clonedWidget = clone.querySelector('#widget');
  if (clonedWidget){
    clonedWidget.style.filter = '';
    clonedWidget.style.transition = '';
    clonedWidget.classList.remove('collapsed');
  }
  const app = clone.querySelector('.app');
  if (app){
    app.style.display = 'flex';
    app.style.justifyContent = 'center';
    app.style.alignItems = 'flex-start';
    app.style.padding = '40px 20px';
    app.style.minHeight = '100vh';
  }
  const preview = clone.querySelector('.preview-col');
  if (preview) preview.style.padding = '0';

  const scripts = clone.querySelectorAll('script');
  const prelude = document.createElement('script');
  prelude.textContent = `window.IS_EDITOR=false;window.__EMBED_LANG='${currentLang}';window.EMBEDDED_CONFIG=${JSON.stringify(state)};`;
  if (scripts.length > 0) scripts[0].parentNode.insertBefore(prelude, scripts[0]);
  else clone.querySelector('body').appendChild(prelude);

  const html = '<!DOCTYPE html>\n' + clone.outerHTML;
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'pc-specs.html';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}

/* ============================================================
   ICON PICKER MODAL
   ============================================================ */
let iconPickerCallback = null;
let activeIconCat = 'all';
let currentIconType = '';

const iconModal = document.getElementById('iconModal');
const iconModalCats = document.getElementById('iconModalCats');
const iconModalGrid = document.getElementById('iconModalGrid');
const iconSearchInput = document.getElementById('iconSearchInput');
const iconModalClose = document.getElementById('iconModalClose');

function renderIconCategories(){
  if (!iconModalCats) return;
  const total = ICON_KEYS.length;
  let html = `<button class="icon-cat-btn ${activeIconCat === 'all' ? 'active' : ''}" data-cat="all" type="button">${esc(t('iconCatAll'))} · ${total}</button>`;
  ICON_CATEGORIES.forEach(cat => {
    const visible = cat.icons.filter(k => ICONS[k]);
    if (visible.length === 0) return;
    html += `<button class="icon-cat-btn ${activeIconCat === cat.id ? 'active' : ''}" data-cat="${cat.id}" type="button">${esc(t(cat.key))} · ${visible.length}</button>`;
  });
  iconModalCats.innerHTML = html;
}
function renderIconGrid(){
  if (!iconModalGrid) return;
  const query = (iconSearchInput ? iconSearchInput.value : '').trim().toLowerCase();
  let html = '';
  const buildTile = (key) => {
    const active = key === currentIconType ? ' active' : '';
    return `<button class="icon-tile${active}" data-key="${key}" type="button" title="${key}">
      ${icon(key)}
      <span class="name">${key}</span>
    </button>`;
  };
  if (query){
    const matches = ICON_KEYS.filter(k => k.toLowerCase().includes(query));
    if (matches.length === 0) html = `<div class="icon-empty">${esc(t('iconNotFound'))} «${esc(query)}»</div>`;
    else html = `<div class="icon-cat-section"><div class="icon-cat-title">${esc(t('iconFound'))} <span class="count">· ${matches.length}</span></div><div class="icon-grid">${matches.map(buildTile).join('')}</div></div>`;
  } else if (activeIconCat === 'all'){
    ICON_CATEGORIES.forEach(cat => {
      const visible = cat.icons.filter(k => ICONS[k]);
      if (visible.length === 0) return;
      html += `<div class="icon-cat-section"><div class="icon-cat-title">${esc(t(cat.key))} <span class="count">· ${visible.length}</span></div><div class="icon-grid">${visible.map(buildTile).join('')}</div></div>`;
    });
  } else {
    const cat = ICON_CATEGORIES.find(c => c.id === activeIconCat);
    if (cat){
      const visible = cat.icons.filter(k => ICONS[k]);
      html = `<div class="icon-cat-section"><div class="icon-cat-title">${esc(t(cat.key))} <span class="count">· ${visible.length}</span></div><div class="icon-grid">${visible.map(buildTile).join('')}</div></div>`;
    }
  }
  iconModalGrid.innerHTML = html;
}
function openIconPicker(currentType, onPick){
  currentIconType = currentType;
  iconPickerCallback = onPick;
  activeIconCat = 'all';
  if (iconSearchInput) iconSearchInput.value = '';
  renderIconCategories();
  renderIconGrid();
  if (iconModal) iconModal.classList.add('open');
  setTimeout(() => { if (iconSearchInput) iconSearchInput.focus(); }, 60);
}
function closeIconPicker(){
  if (iconModal) iconModal.classList.remove('open');
  iconPickerCallback = null;
}
if (iconModalClose) iconModalClose.addEventListener('click', closeIconPicker);
if (iconModal) iconModal.addEventListener('click', (e) => { if (e.target === iconModal) closeIconPicker(); });
if (iconModalCats) iconModalCats.addEventListener('click', (e) => {
  const btn = e.target.closest('.icon-cat-btn');
  if (!btn) return;
  activeIconCat = btn.dataset.cat;
  renderIconCategories();
  renderIconGrid();
});
if (iconSearchInput) iconSearchInput.addEventListener('input', renderIconGrid);
if (iconModalGrid) iconModalGrid.addEventListener('click', (e) => {
  const tile = e.target.closest('.icon-tile');
  if (!tile) return;
  const key = tile.dataset.key;
  if (iconPickerCallback) iconPickerCallback(key);
  closeIconPicker();
});

/* ============================================================
   INIT
   ============================================================ */
const jsonFileInput = document.getElementById('jsonFileInput');
if (jsonFileInput){
  jsonFileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) importJSON(file);
    e.target.value = '';
  });
}

if (!IS_EDITOR && window.__EMBED_LANG === 'en'){
  currentLang = 'en';
  document.documentElement.lang = 'en';
}

renderWidget();
if (IS_EDITOR) {
  applyLang(currentLang);
} else {
  const idMap = [
    ['iconModalTitle', 'iconModalTitle'],
    ['cpTitle',        'colorPopupTitle'],
    ['cpCancel',       'colorPopupCancel'],
    ['cpApply',        'colorPopupApply'],
    ['helpModalTitle', 'helpTitle']
  ];
  idMap.forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) el.textContent = t(key);
  });
  const helpModalBody = document.getElementById('helpModalBody');
  if (helpModalBody) helpModalBody.innerHTML = t('helpContent');
}
applyAccent(state.accent);
window.addEventListener('resize', () => { if (matrixActive) matrixResize(); });
</script>
